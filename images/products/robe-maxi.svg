<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMaxi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF8F4"/>
      <stop offset="100%" stop-color="#EFE0D3"/>
    </linearGradient>
    <linearGradient id="terracottaDress" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D46A42"/>
      <stop offset="50%" stop-color="#BA4E26"/>
      <stop offset="100%" stop-color="#933614"/>
    </linearGradient>
    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8A86C"/>
      <stop offset="100%" stop-color="#C7803E"/>
    </linearGradient>
    <filter id="maxiShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#38231D" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgMaxi)"/>

  <!-- Long Bohemian Crochet Maxi Dress (Robe longue femme en maille ajourée) -->
  <g transform="translate(200, 240)" filter="url(#maxiShadow)">
    <!-- Fine delicate straps (Fines bretelles dorées) -->
    <path d="M-30,-185 L-22,-140 M30,-185 L22,-140" stroke="url(#amberAccent)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- V-neck Bodice (Haut en V ajouré) -->
    <path d="M-22,-140 L0,-115 L22,-140 L38,-130 L28,-75 L-28,-75 L-38,-130 Z" fill="url(#terracottaDress)"/>
    <path d="M-20,-130 C0,-110 0,-110 20,-130" stroke="url(#amberAccent)" stroke-width="1.8" fill="none"/>

    <!-- High Empire Waist with decorative band -->
    <rect x="-28" y="-75" width="56" height="12" rx="3" fill="url(#amberAccent)"/>
    <line x1="-24" y1="-69" x2="24" y2="-69" stroke="#FFF" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Flowing Maxi Skirt with Openwork Crochet Patterns (Jupe longue évasée) -->
    <!-- Tier 1 (Hanches) -->
    <path d="M-28,-63 L-42,10 L42,10 L28,-63 Z" fill="url(#terracottaDress)"/>
    <g stroke="#E8A86C" stroke-width="1" opacity="0.45">
      <circle cx="-25" cy="-25" r="5" fill="none"/>
      <circle cx="0" cy="-25" r="5" fill="none"/>
      <circle cx="25" cy="-25" r="5" fill="none"/>
      <circle cx="-15" cy="-5" r="5" fill="none"/>
      <circle cx="15" cy="-5" r="5" fill="none"/>
    </g>

    <!-- Tier 2 (Mi-longueur évasée avec chevrons) -->
    <path d="M-42,10 L-62,90 L62,90 L42,10 Z" fill="url(#terracottaDress)"/>
    <!-- Lace openwork lines -->
    <path d="M-40,30 L-20,45 L0,30 L20,45 L40,30" stroke="#FFF" stroke-width="1.8" fill="none" opacity="0.65"/>
    <path d="M-50,65 L-25,80 L0,65 L25,80 L50,65" stroke="#FFF" stroke-width="1.8" fill="none" opacity="0.65"/>

    <!-- Tier 3 (Volant bas de robe avec festons amples) -->
    <path d="M-62,90 L-85,175 C-30,190 30,190 85,175 L62,90 Z" fill="url(#terracottaDress)"/>
    <g stroke="url(#amberAccent)" stroke-width="1.8" fill="none" opacity="0.8">
      <path d="M-68,125 Q-35,138 0,130 Q35,138 68,125"/>
      <path d="M-75,152 Q-40,165 0,158 Q40,165 75,152"/>
    </g>

    <!-- Detailed Scalloped Hem (Festons bord bas de robe) -->
    <path d="M-85,175 
             Q-70,184 -55,179 Q-40,186 -25,182 Q-10,188 0,184 Q10,188 25,182 Q40,186 55,179 Q70,184 85,175
             C30,195 -30,195 -85,175" fill="url(#amberAccent)"/>
  </g>

  <!-- Category Tag -->
  <g transform="translate(20, 20)">
    <rect width="65" height="26" rx="13" fill="#FFF7F0" opacity="0.95" stroke="#EAD8C8"/>
    <text x="32" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#8F263B" text-anchor="middle">ROBES</text>
  </g>
</svg>
