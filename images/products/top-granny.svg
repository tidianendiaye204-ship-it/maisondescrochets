<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStudio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7F2"/>
      <stop offset="100%" stop-color="#EFE3D5"/>
    </linearGradient>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C2738"/>
      <stop offset="100%" stop-color="#6E1522"/>
    </linearGradient>
    <linearGradient id="beigeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7EDE2"/>
      <stop offset="100%" stop-color="#D9C7B2"/>
    </linearGradient>
    <linearGradient id="terracottaGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D96E43"/>
      <stop offset="100%" stop-color="#AF4B24"/>
    </linearGradient>
    <filter id="topShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#38231D" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgStudio)"/>

  <!-- Granny Square Crop Top Centerpiece -->
  <g transform="translate(200, 240)" filter="url(#topShadow)">
    <!-- Halterneck braided strings -->
    <path d="M-40,-130 C-40,-180 -10,-195 0,-200 C10,-195 40,-180 40,-130" stroke="#9C2738" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M-38,-130 C-38,-180 -10,-195 0,-200 C10,-195 38,-180 38,-130" stroke="#D9C7B2" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>

    <!-- Main Diamond/Granny Patchwork Shape -->
    <!-- Top Apex Triangle/Diamond -->
    <g transform="translate(0, -90)">
      <polygon points="0,-45 45,0 0,45 -45,0" fill="url(#burgundyGrad)" stroke="#EBDED2" stroke-width="1.5"/>
      <polygon points="0,-28 28,0 0,28 -28,0" fill="url(#beigeGrad)"/>
      <polygon points="0,-12 12,0 0,12 -12,0" fill="url(#terracottaGrad2)"/>
      <circle cx="0" cy="0" r="4" fill="#F7EDE2"/>
    </g>

    <!-- Center Left Diamond -->
    <g transform="translate(-45, -45)">
      <polygon points="0,-45 45,0 0,45 -45,0" fill="url(#beigeGrad)" stroke="#EBDED2" stroke-width="1.5"/>
      <polygon points="0,-28 28,0 0,28 -28,0" fill="url(#burgundyGrad)"/>
      <polygon points="0,-12 12,0 0,12 -12,0" fill="url(#terracottaGrad2)"/>
      <circle cx="0" cy="0" r="4" fill="#F7EDE2"/>
    </g>

    <!-- Center Right Diamond -->
    <g transform="translate(45, -45)">
      <polygon points="0,-45 45,0 0,45 -45,0" fill="url(#beigeGrad)" stroke="#EBDED2" stroke-width="1.5"/>
      <polygon points="0,-28 28,0 0,28 -28,0" fill="url(#burgundyGrad)"/>
      <polygon points="0,-12 12,0 0,12 -12,0" fill="url(#terracottaGrad2)"/>
      <circle cx="0" cy="0" r="4" fill="#F7EDE2"/>
    </g>

    <!-- Lower Center Diamond -->
    <g transform="translate(0, 0)">
      <polygon points="0,-45 45,0 0,45 -45,0" fill="url(#terracottaGrad2)" stroke="#EBDED2" stroke-width="1.5"/>
      <polygon points="0,-28 28,0 0,28 -28,0" fill="url(#beigeGrad)"/>
      <polygon points="0,-12 12,0 0,12 -12,0" fill="url(#burgundyGrad)"/>
      <circle cx="0" cy="0" r="4" fill="#F7EDE2"/>
    </g>

    <!-- Bottom Left Diamond -->
    <g transform="translate(-45, 45)">
      <polygon points="0,-45 45,0 0,45 -45,0" fill="url(#burgundyGrad)" stroke="#EBDED2" stroke-width="1.5"/>
      <polygon points="0,-28 28,0 0,28 -28,0" fill="url(#beigeGrad)"/>
      <polygon points="0,-12 12,0 0,12 -12,0" fill="url(#terracottaGrad2)"/>
      <circle cx="0" cy="0" r="4" fill="#F7EDE2"/>
    </g>

    <!-- Bottom Right Diamond -->
    <g transform="translate(45, 45)">
      <polygon points="0,-45 45,0 0,45 -45,0" fill="url(#burgundyGrad)" stroke="#EBDED2" stroke-width="1.5"/>
      <polygon points="0,-28 28,0 0,28 -28,0" fill="url(#beigeGrad)"/>
      <polygon points="0,-12 12,0 0,12 -12,0" fill="url(#terracottaGrad2)"/>
      <circle cx="0" cy="0" r="4" fill="#F7EDE2"/>
    </g>

    <!-- Bottom Center V-point Diamond -->
    <g transform="translate(0, 90)">
      <polygon points="0,-45 45,0 0,45 -45,0" fill="url(#beigeGrad)" stroke="#EBDED2" stroke-width="1.5"/>
      <polygon points="0,-28 28,0 0,28 -28,0" fill="url(#burgundyGrad)"/>
      <polygon points="0,-12 12,0 0,12 -12,0" fill="url(#terracottaGrad2)"/>
      <circle cx="0" cy="0" r="4" fill="#F7EDE2"/>
    </g>

    <!-- Fringe / Franges au bas du top -->
    <g transform="translate(0, 135)" stroke="#9C2738" stroke-width="2" stroke-linecap="round" opacity="0.85">
      <line x1="-35" y1="-10" x2="-35" y2="40"/>
      <line x1="-25" y1="-5" x2="-25" y2="50"/>
      <line x1="-15" y1="0" x2="-15" y2="55"/>
      <line x1="0" y1="5" x2="0" y2="65"/>
      <line x1="15" y1="0" x2="15" y2="55"/>
      <line x1="25" y1="-5" x2="25" y2="50"/>
      <line x1="35" y1="-10" x2="35" y2="40"/>
    </g>

    <!-- Back Criss-cross string ties (Liens croisés dans le dos) -->
    <path d="M-85,30 C-115,40 -120,80 -125,120" stroke="#9C2738" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M85,30 C115,40 120,80 125,120" stroke="#9C2738" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Category Tag -->
  <g transform="translate(20, 20)">
    <rect width="90" height="26" rx="13" fill="#FFF7F0" opacity="0.95" stroke="#EAD8C8"/>
    <text x="45" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#8F263B" text-anchor="middle">HAUTS & TOPS</text>
  </g>
</svg>
