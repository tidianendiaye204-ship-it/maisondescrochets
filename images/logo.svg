<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C85A32"/>
      <stop offset="100%" stop-color="#8F263B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A86A"/>
      <stop offset="100%" stop-color="#C87A32"/>
    </linearGradient>
  </defs>
  <!-- Yarn ball & hook icon -->
  <g transform="translate(10, 10)">
    <!-- Circular background -->
    <circle cx="30" cy="30" r="28" fill="#FFF7F0" stroke="#EAD8C8" stroke-width="1.5"/>
    
    <!-- Yarn ball texture -->
    <circle cx="30" cy="30" r="20" fill="url(#terracottaGrad)"/>
    <path d="M16 26 C22 18, 38 18, 44 26" stroke="#FAF7F2" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M14 33 C20 42, 40 42, 46 33" stroke="#FAF7F2" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M22 14 C22 26, 38 34, 38 46" stroke="#FAF7F2" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M36 14 C36 26, 20 34, 20 46" stroke="#FAF7F2" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.85"/>
    
    <!-- Crochet hook -->
    <path d="M12 48 L46 14" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M46 14 C48 12, 50 14, 48 16 C46 18, 45 16, 45 15" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Trailing yarn thread -->
    <path d="M30 49 C26 56, 38 58, 44 54 C48 51, 52 54, 55 58" stroke="#8F263B" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="1 0"/>
  </g>
  
  <!-- Brand Typography -->
  <text x="80" y="36" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="22" font-weight="700" fill="#38231D" letter-spacing="0.5">Maison des Crochets</text>
  <text x="82" y="54" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="9" font-weight="600" fill="#8F263B" letter-spacing="2.8">DAKAR • FAIT MAIN</text>
</svg>
