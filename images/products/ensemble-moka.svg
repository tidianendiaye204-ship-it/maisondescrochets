<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMoka" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F5"/>
      <stop offset="100%" stop-color="#EDE2D8"/>
    </linearGradient>
    <linearGradient id="mokaYarn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E4334"/>
      <stop offset="50%" stop-color="#543125"/>
      <stop offset="100%" stop-color="#3B2017"/>
    </linearGradient>
    <linearGradient id="warmOchre" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C28753"/>
      <stop offset="100%" stop-color="#945F33"/>
    </linearGradient>
    <filter id="mokaShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#2D1C16" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgMoka)"/>

  <!-- Top Sweetheart Neckline (Haut bretelles en cœur) -->
  <g transform="translate(200, 150)" filter="url(#mokaShadow)">
    <!-- Straps -->
    <path d="M-40,-70 L-40,-30 M40,-70 L40,-30" stroke="url(#warmOchre)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Heart Bodice -->
    <path d="M-65,-10 
             C-65,-38 -30,-42 0,-15 
             C30,-42 65,-38 65,-10 
             L55,45 C25,48 -25,48 -55,45 Z" fill="url(#mokaYarn)"/>
             
    <!-- Crochet stitch texture lines -->
    <path d="M-55,0 C-30,-15 30,-15 55,0" stroke="#8C5C4B" stroke-width="1.8" stroke-dasharray="3,3" fill="none"/>
    <path d="M-52,15 C-25,5 25,5 52,15" stroke="#8C5C4B" stroke-width="1.8" stroke-dasharray="3,3" fill="none"/>
    <path d="M-48,30 C-20,22 20,22 48,30" stroke="#8C5C4B" stroke-width="1.8" stroke-dasharray="3,3" fill="none"/>

    <!-- Center tie knot with dangling strings -->
    <circle cx="0" cy="-8" r="4.5" fill="url(#warmOchre)"/>
    <path d="M-2,-4 C-8,15 -4,28 -7,40 M2,-4 C8,15 4,28 7,40" stroke="url(#warmOchre)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Matching Crochet Shorts (Short assorti) -->
  <g transform="translate(200, 310)" filter="url(#mokaShadow)">
    <!-- Waistband with drawstring -->
    <rect x="-60" y="-30" width="120" height="15" rx="5" fill="url(#warmOchre)"/>
    <path d="M0,-22 C-10,-5 -15,10 -15,22 M0,-22 C10,-5 15,10 15,22" stroke="#FFF7F0" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Shorts body -->
    <path d="M-60,-15 L-68,60 C-40,65 -15,62 -6,35 L6,35 C15,62 40,65 68,60 L60,-15 Z" fill="url(#mokaYarn)"/>

    <!-- Crochet stitch textured horizontal rows -->
    <path d="M-58,5 C-20,8 20,8 58,5" stroke="#8C5C4B" stroke-width="1.8" stroke-dasharray="3,3" fill="none"/>
    <path d="M-62,25 C-20,28 20,28 62,25" stroke="#8C5C4B" stroke-width="1.8" stroke-dasharray="3,3" fill="none"/>
    <path d="M-65,45 C-40,48 -15,45 -8,32" stroke="#8C5C4B" stroke-width="1.8" stroke-dasharray="3,3" fill="none"/>
    <path d="M65,45 C40,48 15,45 8,32" stroke="#8C5C4B" stroke-width="1.8" stroke-dasharray="3,3" fill="none"/>

    <!-- Scalloped leg hems (Festons délicats au bas du short) -->
    <path d="M-68,60 Q-55,65 -42,61 Q-29,65 -16,60 L-10,48" stroke="url(#warmOchre)" stroke-width="2.5" fill="none"/>
    <path d="M68,60 Q55,65 42,61 Q29,65 16,60 L10,48" stroke="url(#warmOchre)" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Category Tag -->
  <g transform="translate(20, 20)">
    <rect width="95" height="26" rx="13" fill="#FFF7F0" opacity="0.95" stroke="#EAD8C8"/>
    <text x="47" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#8F263B" text-anchor="middle">ENSEMBLES</text>
  </g>
</svg>
